# Fetches Open-Meteo's forecast for all ~2,100 outlook regions twice a day and commits world_outlook_today.json,
# which colours the globe's "Next 14 days" view and spares each visitor the weather calls on country pages.
# It runs from GitHub's servers, so it does not use any visitor's Open-Meteo quota.
name: World outlook snapshot

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - world_outlook.js
      - src/wol.ts
      - scripts/world_outlook_today.ts
      - .github/workflows/world-outlook-today.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: world-outlook-today
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run outlook-today
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world_outlook_today.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh the 14-day outlook snapshot"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Ask GitHub Pages to rebuild
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
